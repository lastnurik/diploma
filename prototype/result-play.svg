    <text x="944" y="535" font-size="15" fill="#355e49" font-weight="400" style="fill:#355e49">fixed raised walkway.</text>
    <text x="944" y="593" font-size="12" fill="#626a63" font-weight="400" style="fill:#626a63">The first format supports bounded movement,</text>
    <text x="944" y="616" font-size="12" fill="#626a63" font-weight="400" style="fill:#626a63">without boat physics or open-water navigation.</text>
    <text x="944" y="639" font-size="12" fill="#626a63" font-weight="400" style="fill:#626a63" />
