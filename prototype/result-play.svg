<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="760" viewBox="0 0 1320 760" role="img" aria-labelledby="title desc"><title id="title">Author journey · B / review and play</title><desc id="desc">Conceptual low fidelity prototype. Static screens with illustrative content; no implemented generation or gameplay.</desc><rect width="1320" height="760" fill="#f1f3f4"/><g font-family="DejaVu Sans, sans-serif"><text x="40" y="42" font-size="28" font-weight="bold" fill="#263238">Author journey · B / review and play</text><text x="40" y="76" font-size="17" fill="#263238">CONCEPT ONLY · static wireframes · all data and statuses below are illustrative</text><rect x="40" y="120" width="590" height="570" rx="4" fill="#fff" stroke="#80909b"/><text x="64" y="157" font-size="25" font-weight="bold" fill="#263238">3 · Review the generated result</text><text x="64" y="186" font-size="16" fill="#536570">Flooded town / version 2 / ready · example</text><text x="64" y="226" font-size="23" font-weight="bold" fill="#263238">Medicine for the town</text><text x="64" y="260" font-size="17" fill="#263238">Objective: reach the clinic with the medicine.</text><text x="64" y="307" font-size="20" font-weight="bold" fill="#263238">Changes from your request</text><rect x="64" y="325" width="542" height="153" rx="4" fill="#f7f8f9" stroke="#80909b"/><text x="78" y="355" font-size="17" fill="#263238">Requested: free sailing across an open town</text><text x="78" y="388" font-size="17" fill="#263238">Proposed: one bounded scene with route choices</text><text x="78" y="421" font-size="16" fill="#263238">Reason: first version supports a smaller action set</text><text x="78" y="454" font-size="16" fill="#263238">Story retained: courier, flood, medicine delivery</text><text x="64" y="516" font-size="16" fill="#263238">Read the changes, then try the game or revise the idea.</text><text x="64" y="546" font-size="16" fill="#263238">Editing creates a new version; version 2 stays available.</text><rect x="64" y="587" width="145" height="42" rx="4" fill="#e6ebee" stroke="#536570"/><text x="76" y="614" font-size="17" font-weight="bold" fill="#263238">Play → 4</text><rect x="225" y="587" width="175" height="42" rx="4" fill="#e6ebee" stroke="#536570"/><text x="237" y="614" font-size="17" font-weight="bold" fill="#263238">Revise idea → 1</text><rect x="416" y="587" width="175" height="42" rx="4" fill="#e6ebee" stroke="#536570"/><text x="428" y="614" font-size="17" font-weight="bold" fill="#263238">Catalogue → 5</text><rect x="690" y="120" width="590" height="570" rx="4" fill="#fff" stroke="#80909b"/><text x="714" y="157" font-size="25" font-weight="bold" fill="#263238">4 · Play and reach an ending</text><text x="714" y="186" font-size="16" fill="#536570">Playable preview concept · version 2</text><rect x="714" y="209" width="542" height="250" rx="4" fill="#e8edef" stroke="#80909b"/><text x="730" y="238" font-size="17" font-weight="bold" fill="#263238">Goal: deliver medicine to the clinic</text><rect x="744" y="278" width="88" height="70" rx="4" fill="#fff" stroke="#80909b"/><text x="756" y="319" font-size="15" fill="#263238">HOME</text><rect x="1110" y="278" width="118" height="70" rx="4" fill="#fff" stroke="#80909b"/><text x="1124" y="319" font-size="15" fill="#263238">CLINIC</text><rect x="832" y="304" width="79" height="22" rx="4" fill="#a8b4bd" stroke="#a8b4bd"/><rect x="889" y="304" width="22" height="101" rx="4" fill="#a8b4bd" stroke="#a8b4bd"/><rect x="889" y="383" width="232" height="22" rx="4" fill="#a8b4bd" stroke="#a8b4bd"/><rect x="1099" y="348" width="22" height="57" rx="4" fill="#a8b4bd" stroke="#a8b4bd"/><circle cx="940" cy="394" r="13" fill="#536570"/><text x="730" y="441" font-size="15" fill="#263238">Schematic scene · character, route and destination</text><text x="714" y="491" font-size="17" fill="#263238">Controls: arrows / WASD to move · E to interact</text><rect x="714" y="516" width="542" height="77" rx="4" fill="#f7f8f9" stroke="#80909b"/><text x="728" y="545" font-size="16" font-weight="bold" fill="#263238">ENDING STATE (alternative to the scene above)</text><text x="728" y="574" font-size="16" fill="#263238">Delivery complete. The clinic receives the medicine.</text><rect x="714" y="618" width="145" height="42" rx="4" fill="#e6ebee" stroke="#536570"/><text x="726" y="645" font-size="17" font-weight="bold" fill="#263238">Restart</text><rect x="875" y="618" width="180" height="42" rx="4" fill="#e6ebee" stroke="#536570"/><text x="887" y="645" font-size="17" font-weight="bold" fill="#263238">Result → 3</text><rect x="1071" y="618" width="185" height="42" rx="4" fill="#e6ebee" stroke="#536570"/><text x="1083" y="645" font-size="17" font-weight="bold" fill="#263238">Catalogue → 5</text><text x="40" y="730" font-size="17" fill="#263238">Navigation: 3 Play → 4; 3 Revise → 1 with prior input; 4 Restart resets this game; 4 Result → 3.</text></g></svg>