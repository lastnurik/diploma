    <text x="294" y="249" font-size="29" fill="#28312a" font-weight="500" style="fill:#28312a">What happens in your story?</text>
    <text x="294" y="279" font-size="14" fill="#626a63" font-weight="400" style="fill:#626a63">Start with a character, a place and a goal.</text>
    <text x="294" y="327" font-size="13" fill="#28312a" font-weight="600" style="fill:#28312a">Your request</text>
    <text x="674" y="327" font-size="12" fill="#626a63" font-weight="400" style="fill:#626a63">Version 2</text>
    <text x="294" y="363" font-size="12" fill="#28312a" font-weight="600" style="fill:#28312a">Story or game idea</text>
    <rect x="294" y="377" width="482" height="137" rx="8" fill="#ffffff" stroke="#dde2dc" style="fill:#ffffff;stroke:#dde2dc" />
    <text x="310" y="406" font-size="14" fill="#626a63" font-weight="400" style="fill:#626a63">A courier must deliver medicine across a</text>
    <text x="310" y="431" font-size="14" fill="#626a63" font-weight="400" style="fill:#626a63">flooded town. Sail freely to help a neighbour,</text>
    <text x="310" y="456" font-size="14" fill="#626a63" font-weight="400" style="fill:#626a63">collect medicine at the depot and bring it to</text>
    <text x="310" y="481" font-size="14" fill="#626a63" font-weight="400" style="fill:#626a63">the clinic before the town is cut off.</text>
    <text x="294" y="535" font-size="11" fill="#626a63" font-weight="400" style="fill:#626a63">Read-only example. The planned product allows editing.</text>
    <text x="294" y="568" font-size="12" fill="#28312a" font-weight="600" style="fill:#28312a">Genre intent</text>
    <rect x="294" y="580" width="482" height="42" rx="8" fill="#ffffff" stroke="#dde2dc" style="fill:#ffffff;stroke:#dde2dc" />
    <text x="308" y="607" font-size="14" fill="#28312a" font-weight="400" style="fill:#28312a">Narrative adventure</text>
    <text x="294" y="641" font-size="12" fill="#28312a" font-weight="600" style="fill:#28312a">Desired goal</text>
    <rect x="294" y="653" width="482" height="42" rx="8" fill="#ffffff" stroke="#dde2dc" style="fill:#ffffff;stroke:#dde2dc" />
    <text x="308" y="680" font-size="14" fill="#28312a" font-weight="400" style="fill:#28312a">Deliver the medicine to the clinic</text>
    <text x="294" y="727" font-size="13" fill="#626a63" font-weight="400" style="fill:#626a63">Main action: Explore, collect and interact</text>
    <rect x="294" y="759" width="224" height="42" rx="6" fill="#28312a" stroke="#28312a" style="fill:#28312a;stroke:#28312a" />
    <text x="310" y="786" font-size="13" fill="#fff" font-weight="600" style="fill:#fff">View submitted example →</text>
