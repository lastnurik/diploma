<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="760" viewBox="0 0 1320 760" role="img" aria-labelledby="title desc"><title id="title">Author journey · A / input and progress</title><desc id="desc">Conceptual low fidelity prototype. Static screens with illustrative content; no implemented generation or gameplay.</desc><rect width="1320" height="760" fill="#f1f3f4"/><g font-family="DejaVu Sans, sans-serif"><text x="40" y="42" font-size="28" font-weight="bold" fill="#263238">Author journey · A / input and progress</text><text x="40" y="76" font-size="17" fill="#263238">CONCEPT ONLY · static wireframes · all data and statuses below are illustrative</text><rect x="40" y="120" width="590" height="570" rx="4" fill="#fff" stroke="#80909b"/><text x="64" y="157" font-size="25" font-weight="bold" fill="#263238">1 · Describe your game</text><text x="64" y="186" font-size="16" fill="#536570">New project / draft</text><text x="64" y="225" font-size="17" font-weight="bold" fill="#263238">Story or game idea</text><rect x="64" y="237" width="542" height="90" rx="4" fill="#f7f8f9" stroke="#aab4bb"/><text x="76" y="264" font-size="17" fill="#263238">A courier must deliver medicine across a flooded</text><text x="76" y="288" font-size="17" fill="#263238">town. Sail freely to help a neighbour and reach</text><text x="76" y="312" font-size="17" fill="#263238">the clinic.</text><text x="64" y="365" font-size="17" font-weight="bold" fill="#263238">Preferences · examples to discuss</text><rect x="64" y="377" width="542" height="85" rx="4" fill="#f7f8f9" stroke="#aab4bb"/><text x="76" y="404" font-size="17" fill="#263238">View: top-down 2D       Mood: hopeful</text><text x="76" y="428" font-size="17" fill="#263238">Goal: deliver medicine       Main action: explore</text><text x="64" y="495" font-size="17" fill="#263238">Supported mechanics are still under review.</text><text x="64" y="526" font-size="17" fill="#263238">Keep the original idea when editing or retrying.</text><rect x="64" y="587" width="210" height="42" rx="4" fill="#e6ebee" stroke="#536570"/><text x="76" y="614" font-size="17" font-weight="bold" fill="#263238">Generate version →</text><rect x="292" y="587" width="170" height="42" rx="4" fill="#e6ebee" stroke="#536570"/><text x="304" y="614" font-size="17" font-weight="bold" fill="#263238">Catalogue → 5</text><rect x="690" y="120" width="590" height="570" rx="4" fill="#fff" stroke="#80909b"/><text x="714" y="157" font-size="25" font-weight="bold" fill="#263238">2 · Follow generation</text><text x="714" y="186" font-size="16" fill="#536570">Flooded town / version 2 / job 024 · example</text><text x="714" y="226" font-size="22" font-weight="bold" fill="#263238">Current stage: Validating</text><text x="714" y="259" font-size="16" fill="#263238">Last update: 14:32:08 UTC · illustrative</text><text x="714" y="307" font-size="18" fill="#263238">Done · Queued         14:31:10</text><text x="714" y="344" font-size="18" fill="#263238">Done · Generating    14:31:14</text><text x="714" y="381" font-size="18" font-weight="bold" fill="#263238">● Validating      14:32:08</text><text x="714" y="418" font-size="18" fill="#263238">○ Ready            waiting for checks</text><rect x="714" y="452" width="542" height="92" rx="4" fill="#f7f8f9" stroke="#80909b"/><text x="728" y="481" font-size="17" fill="#263238">Show recorded job stages from the service.</text><text x="728" y="510" font-size="17" fill="#263238">No percentage or time remaining without evidence.</text><text x="714" y="573" font-size="17" fill="#263238">You can leave this screen and return from Catalogue.</text><rect x="714" y="608" width="200" height="42" rx="4" fill="#e6ebee" stroke="#536570"/><text x="726" y="635" font-size="17" font-weight="bold" fill="#263238">Catalogue → 5</text><text x="930" y="635" font-size="16" fill="#263238">Ready → 3 · failed → 6</text><text x="40" y="730" font-size="17" fill="#263238">Navigation: 1 Generate → 2; 2 Ready → 3; 2 Failed → 6. Arrows describe intended navigation only.</text></g></svg>