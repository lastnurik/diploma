    <text x="892" y="349" font-size="10" fill="#626a63" font-weight="600" style="fill:#626a63">RECOVERY EXAMPLE · VERSION 3</text>
    <text x="892" y="387" font-size="23" fill="#28312a" font-weight="500" style="fill:#28312a">This request could not</text>
    <text x="892" y="418" font-size="23" fill="#28312a" font-weight="500" style="fill:#28312a">become a game.</text>
    <rect x="892" y="444" width="448" height="103" rx="8" fill="#fbefeb" stroke="#fbefeb" style="fill:#fbefeb;stroke:#fbefeb" />
    <text x="908" y="472" font-size="12" fill="#943f36" font-weight="400" style="fill:#943f36">Essential mechanic is outside the proposed scope.</text>
    <text x="908" y="497" font-size="12" fill="#943f36" font-weight="400" style="fill:#943f36">Free sailing cannot be replaced without changing</text>
    <text x="908" y="522" font-size="12" fill="#943f36" font-weight="400" style="fill:#943f36">the core experience. No playable result is offered.</text>
