<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="760" viewBox="0 0 1320 760" role="img" aria-labelledby="title desc"><title id="title">Author journey · C / versions and recovery</title><desc id="desc">Static wireframe: version 4 is validating, version 3 failed because essential sailing is unsupported, and version 2 is ready. No generator or game runs here.</desc><rect width="1320" height="760" fill="#f1f3f4"/><g font-family="DejaVu Sans, sans-serif"><text x="40" y="42" font-size="28" font-weight="bold" fill="#263238">Author journey · C / versions and recovery</text><text x="40" y="76" font-size="17" fill="#263238">CONCEPT ONLY · static wireframes · all records are illustrative</text><rect x="40" y="120" width="590" height="570" rx="4" fill="#fff" stroke="#80909b"/><rect x="690" y="120" width="590" height="570" rx="4" fill="#fff" stroke="#80909b"/><text x="64" y="157" font-size="25" font-weight="bold" fill="#263238">5 · Find versions</text><text x="64" y="186" font-size="16" fill="#536570">Flooded town · illustrative project FT-01</text><rect x="64" y="209" width="180" height="42" rx="4" fill="#e6ebee" stroke="#536570"/><text x="76" y="236" font-size="17" font-weight="bold" fill="#263238">New idea → 1</text><text x="64" y="303" font-size="20" font-weight="bold" fill="#263238">Version 4 · Validating</text><text x="64" y="328" font-size="16" fill="#263238">Revised from failed version 3</text><rect x="64" y="341" width="175" height="42" rx="4" fill="#e6ebee" stroke="#536570"/><text x="76" y="368" font-size="17" font-weight="bold" fill="#263238">Progress → 2b</text><text x="64" y="420" font-size="20" font-weight="bold" fill="#263238">Version 3 · Failed</text><text x="64" y="445" font-size="16" fill="#263238">Essential free sailing was unsupported</text><rect x="64" y="458" width="175" height="42" rx="4" fill="#e6ebee" stroke="#536570"/><text x="76" y="485" font-size="17" font-weight="bold" fill="#263238">Failure → 6</text><text x="64" y="537" font-size="20" font-weight="bold" fill="#263238">Version 2 · Ready</text><text x="64" y="562" font-size="16" fill="#263238">Fixed walkway and clinic delivery</text><rect x="64" y="575" width="175" height="42" rx="4" fill="#e6ebee" stroke="#536570"/><text x="76" y="602" font-size="17" font-weight="bold" fill="#263238">Result → 3</text><text x="64" y="651" font-size="16" fill="#263238">Opening a version preserves its own request and outcome.</text><text x="714" y="157" font-size="25" font-weight="bold" fill="#263238">6 · Understand failure</text><text x="714" y="186" font-size="16" fill="#536570">Flooded town / version 3 / failed · example</text><text x="714" y="228" font-size="22" font-weight="bold" fill="#263238">No playable result for version 3</text><rect x="714" y="247" width="542" height="153" rx="4" fill="#f7f8f9" stroke="#80909b"/><text x="728" y="278" font-size="17" fill="#263238">Essential free sailing is outside the first format.</text><text x="728" y="311" font-size="16" fill="#263238">A fixed walkway would change the core experience.</text><text x="728" y="344" font-size="16" fill="#263238">No game is offered for this failed version.</text><text x="728" y="377" font-size="16" fill="#263238">The original request remains available.</text><text x="714" y="446" font-size="19" font-weight="bold" fill="#263238">Revise and submit a new version</text><text x="714" y="480" font-size="16" fill="#263238">Version 4 permits a fixed raised walkway.</text><text x="714" y="513" font-size="16" fill="#263238">It has a separate job; version 3 stays failed.</text><rect x="714" y="565" width="220" height="42" rx="4" fill="#e6ebee" stroke="#536570"/><text x="726" y="592" font-size="17" font-weight="bold" fill="#263238">Review revision → 1b</text><rect x="949" y="565" width="190" height="42" rx="4" fill="#e6ebee" stroke="#536570"/><text x="961" y="592" font-size="17" font-weight="bold" fill="#263238">Ready v2 → 3</text><rect x="714" y="618" width="190" height="42" rx="4" fill="#e6ebee" stroke="#536570"/><text x="726" y="645" font-size="17" font-weight="bold" fill="#263238">Versions → 5</text><text x="40" y="730" font-size="16" fill="#263238">Navigation: v2 ready → result; v3 failed → revision; v4 validating → its job. Arrows show intended navigation only.</text></g></svg>