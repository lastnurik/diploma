<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Proposed system context</title><desc id="desc">Author, proposed platform and optional external model provider. The platform accepts stories and returns status, a playable game or a safe failure; provider output remains untrusted.</desc>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 z" fill="#426174"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="600" y="55" fill="#193347" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle">Proposed system context</text>
<text x="600" y="91" fill="#526774" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="middle">Story input → validated game or a clear failure</text>
<rect x="45" y="165" width="235" height="210" rx="17" fill="#eaf1f4" stroke="#5f7889" stroke-width="2.5"/>
<rect x="430" y="135" width="340" height="270" rx="17" fill="#eaf1f4" stroke="#5f7889" stroke-width="2.5"/>
<rect x="920" y="165" width="235" height="210" rx="17" fill="#fff1eb" stroke="#9a492d" stroke-width="2.5"/>
<text x="162" y="235" fill="#193347" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="middle">Author</text>
<text x="162" y="280" fill="#193347" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="middle">Creates a story</text>
<text x="162" y="314" fill="#193347" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="middle">and plays</text>
<text x="600" y="210" fill="#193347" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="middle">Proposed platform</text>
<text x="600" y="258" fill="#193347" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="middle">Authoring · generation</text>
<text x="600" y="294" fill="#193347" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="middle">Validation · play</text>
<text x="600" y="346" fill="#526774" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Maintained browser runtime</text>
<text x="1037" y="230" fill="#193347" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle">External model</text>
<text x="1037" y="271" fill="#193347" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="middle">Optional provider</text>
<text x="1037" y="310" fill="#193347" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="middle">Untrusted output</text>
<path d="M 280 225 H 430" fill="none" stroke="#426174" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 430 326 H 280" fill="none" stroke="#426174" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 770 225 H 920" fill="none" stroke="#426174" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 920 326 H 770" fill="none" stroke="#426174" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="355" y="206" fill="#193347" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">Story</text>
<text x="355" y="357" fill="#193347" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">Result</text>
<text x="845" y="205" fill="#193347" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">Prompt</text>
<text x="845" y="356" fill="#193347" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle">Output</text>
<text x="600" y="462" fill="#526774" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="middle">Only validated data reaches the maintained game runtime.</text>
