  <rect x="350" y="74" width="656" height="792" rx="16" fill="#fff"/>
  <text x="678" y="103" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#334155">AI-assisted browser-game platform · proposed</text>
