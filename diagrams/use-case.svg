<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1070" viewBox="0 0 1000 1070" role="img" aria-labelledby="title desc">
<title id="title">Proposed author use cases</title><desc id="desc">One author is associated with seven goals UC-01 through UC-07. Associations are not execution-order arrows.</desc>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 z" fill="#426174"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="500" y="52" fill="#193347" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle">Author use cases · proposed</text>
<rect x="333" y="91" width="635" height="900" rx="25" fill="#ffffff" stroke="#5f7889" stroke-width="2.5"/>
<text x="650" y="136" fill="#193347" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="middle">AI-assisted browser-game platform</text>
<circle cx="170" cy="454" r="32" fill="white" stroke="#193347" stroke-width="4"/>
<path d="M 170 486 V 589 M 100 524 H 240 M 170 589 L 111 665 M 170 589 L 229 665" fill="none" stroke="#193347" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="170" y="706" fill="#193347" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" text-anchor="middle">Author</text>
<path d="M 246 552 L 386 211" fill="none" stroke="#5f7889" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<ellipse cx="658.0" cy="211.0" rx="272.0" ry="42.0" fill="#eaf2f8" stroke="#5284a1" stroke-width="2.4"/>
<text x="658" y="220" fill="#193347" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="500" text-anchor="middle">UC-01 · Enter or edit storyline</text>
<path d="M 246 552 L 386 330" fill="none" stroke="#5f7889" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<ellipse cx="658.0" cy="330.0" rx="272.0" ry="42.0" fill="#eaf2f8" stroke="#5284a1" stroke-width="2.4"/>
<text x="658" y="339" fill="#193347" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="500" text-anchor="middle">UC-02 · Submit generation request</text>
<path d="M 246 552 L 386 449" fill="none" stroke="#5f7889" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<ellipse cx="658.0" cy="449.0" rx="272.0" ry="42.0" fill="#eaf2f8" stroke="#5284a1" stroke-width="2.4"/>
<text x="658" y="458" fill="#193347" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="500" text-anchor="middle">UC-03 · Check status or failure</text>
<path d="M 246 552 L 386 568" fill="none" stroke="#5f7889" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<ellipse cx="658.0" cy="568.0" rx="272.0" ry="42.0" fill="#eaf2f8" stroke="#5284a1" stroke-width="2.4"/>
<text x="658" y="577" fill="#193347" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="500" text-anchor="middle">UC-04 · Inspect result and changes</text>
<path d="M 246 552 L 386 687" fill="none" stroke="#5f7889" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<ellipse cx="658.0" cy="687.0" rx="272.0" ry="42.0" fill="#eaf2f8" stroke="#5284a1" stroke-width="2.4"/>
<text x="658" y="696" fill="#193347" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="500" text-anchor="middle">UC-05 · Play, finish and replay</text>
<path d="M 246 552 L 386 806" fill="none" stroke="#5f7889" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<ellipse cx="658.0" cy="806.0" rx="272.0" ry="42.0" fill="#eaf2f8" stroke="#5284a1" stroke-width="2.4"/>
<text x="658" y="815" fill="#193347" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="500" text-anchor="middle">UC-06 · Browse saved versions</text>
<path d="M 246 552 L 386 925" fill="none" stroke="#5f7889" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<ellipse cx="658.0" cy="925.0" rx="272.0" ry="42.0" fill="#eaf2f8" stroke="#5284a1" stroke-width="2.4"/>
<text x="658" y="934" fill="#193347" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="500" text-anchor="middle">UC-07 · Retry or regenerate version</text>
<text x="650" y="1037" fill="#526774" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Associations show author goals; they do not show execution order.</text>
