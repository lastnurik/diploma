<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="900" viewBox="0 0 1050 900" role="img" aria-labelledby="title desc">
  <title id="title">Author use cases for the proposed browser game platform</title>
  <desc id="desc">The author is associated with seven use cases: enter story and parameters; submit generation; check progress or failure; inspect result and simplifications; preview, play, finish and replay; browse catalogue and versions; edit and retry or regenerate. All cases are inside the proposed platform boundary.</desc>
