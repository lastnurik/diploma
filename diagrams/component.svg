<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
<title id="title">Proposed component architecture</title><desc id="desc">The platform starts a generation job and returns status or failure. An independent gate validates the untrusted AI candidate. Approved data is stored and delivered by the platform to a maintained browser runtime.</desc>
